name: "Skillporter — Validate, Scan, Lock-Check & Comment on PRs"
description: "Validate SKILL.md compliance, run security scans (SARIF 2.1.0), verify lockfiles, and post PR diagnostic reports."
author: "Shanmukh Dheekonda"
branding:
  icon: "shield"
  color: "blue"

inputs:
  command:
    description: "Skillporter command to execute (validate, scan, diagnose, doctor, lock, audit)"
    required: false
    default: "validate"
  path:
    description: "Path to repository or skill directory"
    required: false
    default: "."
  harnesses:
    description: "Comma-separated harness IDs for diagnose (e.g. claude-code,codex,cursor)"
    required: false
    default: ""
  run-security-scan:
    description: "Also execute `skillporter scan` supply-chain security check"
    required: false
    default: "true"
  max-risk-score:
    description: "Maximum allowed 0-100 security risk score before failing closed"
    required: false
    default: ""
  sarif-file:
    description: "Output path for SARIF 2.1.0 security report (e.g. skillporter.sarif)"
    required: false
    default: "skillporter.sarif"
  upload-sarif:
    description: "Upload SARIF report to GitHub Code Scanning"
    required: false
    default: "false"
  lock-check:
    description: "Run `skillporter lock --check` to fail CI on lockfile drift"
    required: false
    default: "false"
  pr-comment:
    description: "Generate and post an actionable `skillporter ci-report` comment on pull requests"
    required: false
    default: "false"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Skillporter
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install "${ACTION_PATH}"

    - name: Run Skillporter Primary Check
      shell: bash
      env:
        SP_COMMAND: ${{ inputs.command }}
        SP_PATH: ${{ inputs.path }}
        SP_HARNESSES: ${{ inputs.harnesses }}
        SP_MAX_RISK: ${{ inputs.max-risk-score }}
      run: |
        set -euo pipefail
        case "${SP_COMMAND}" in
          validate|scan|diagnose|doctor|lock|audit) ;;
          *)
            echo "error: unsupported action command '${SP_COMMAND}'" >&2
            exit 2
            ;;
        esac
        EXTRA_ARGS=()
        if [ -n "${SP_MAX_RISK}" ] && [[ "${SP_COMMAND}" =~ ^(validate|scan)$ ]]; then
          EXTRA_ARGS+=("--max-risk-score" "${SP_MAX_RISK}")
        fi
        if [ "${SP_COMMAND}" = "diagnose" ] && [ -n "${SP_HARNESSES}" ]; then
          skillporter diagnose "${SP_PATH}" --harness "${SP_HARNESSES}"
        else
          skillporter "${SP_COMMAND}" "${SP_PATH}" "${EXTRA_ARGS[@]}"
        fi

    - name: Run Security Assessment & Emit SARIF 2.1.0
      if: ${{ inputs.run-security-scan == 'true' }}
      shell: bash
      env:
        SP_PATH: ${{ inputs.path }}
        SP_MAX_RISK: ${{ inputs.max-risk-score }}
        SP_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        RISK_ARGS=()
        if [ -n "${SP_MAX_RISK}" ]; then
          RISK_ARGS+=("--max-risk-score" "${SP_MAX_RISK}")
        fi
        skillporter scan "${SP_PATH}" --format sarif "${RISK_ARGS[@]}" > "${SP_SARIF_FILE}"
        skillporter scan "${SP_PATH}" "${RISK_ARGS[@]}"

    - name: Verify Lockfile Integrity (lock --check)
      if: ${{ inputs.lock-check == 'true' }}
      shell: bash
      env:
        SP_PATH: ${{ inputs.path }}
      run: |
        skillporter lock "${SP_PATH}" --check

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Post PR Diagnostic & Security Report
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SP_PATH: ${{ inputs.path }}
        SP_REPO: ${{ github.repository }}
        SP_PR: ${{ github.event.pull_request.number }}
      run: |
        skillporter ci-report "${SP_PATH}" \
          --github-repo "${SP_REPO}" \
          --pr "${SP_PR}"
