<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" role="img" aria-label="Skillporter 3.0 CLI and multi-harness bridge workflow">
  <defs>
    <linearGradient id="sp-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#155BE8" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#0B1425" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F18A50" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="sp-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#155BE8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#155BE8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#F18A50" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F18A50" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bridge-clip">
      <rect x="632" y="138" width="56" height="12"/>
    </clipPath>
  </defs>

  <style>
    .frame { fill: #070D19; stroke: #263249; stroke-width: 1.5; }
    .chrome { fill: #0B1425; }
    .card { fill: #0B1425; stroke: #263249; stroke-width: 1; }
    .rule { stroke: #263249; stroke-width: 1; }
    .rule-soft { stroke: #1A2538; stroke-width: 1; }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12px; fill: #A6B0C0; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ivory { fill: #F3F0E9; }
    .dim { fill: #7C879B; }
    .blue { fill: #8AB4FF; }
    .amber { fill: #F18A50; }
    .bold { font-weight: 600; }
    .small { font-size: 11px; }
    .micro { font-size: 10px; letter-spacing: 0.07em; }

    .ln { opacity: 0; animation: appear 12s infinite; }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.8s; }
    .l3 { animation-delay: 1.3s; }
    .l4 { animation-delay: 1.8s; }
    .l5 { animation-delay: 2.3s; }
    .l6 { animation-delay: 2.8s; }
    .l7 { animation-delay: 3.3s; }
    .l8 { animation-delay: 3.9s; }
    .l9 { animation-delay: 4.5s; }
    .l10 { animation-delay: 5.2s; }

    .packet { animation: flow 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .cursor { animation: blink 1.1s steps(2, end) infinite; }
    .beacon { animation: pulse-dot 2.4s ease-in-out infinite; transform-origin: 944px 23px; }

    @keyframes appear {
      0%, 3% { opacity: 0; transform: translateY(3px); }
      7%, 92% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; }
    }
    @keyframes flow {
      0% { transform: translateX(-28px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(64px); opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ln { opacity: 1 !important; animation: none !important; transform: none !important; }
      .packet, .cursor, .beacon { animation: none !important; }
    }
  </style>

  <!-- Outer frame -->
  <rect class="frame" x="1" y="1" width="978" height="488" rx="12"/>
  <rect fill="url(#sp-wash)" x="2" y="2" width="976" height="486" rx="11"/>

  <!-- Top chrome bar -->
  <path class="chrome" d="M 2 13 Q 2 2 13 2 L 967 2 Q 978 2 978 13 L 978 44 L 2 44 Z"/>
  <line class="rule" x1="1" y1="44" x2="979" y2="44"/>

  <!-- Mini bridge mark in top bar -->
  <g transform="translate(20, 14)">
    <path d="M 4 12 Q 18 0 32 12" fill="none" stroke="#1461ED" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="12" y1="6" x2="12" y2="12" stroke="#1461ED" stroke-width="1.8"/>
    <line x1="18" y1="4" x2="18" y2="12" stroke="#1461ED" stroke-width="1.8"/>
    <line x1="24" y1="6" x2="24" y2="12" stroke="#1461ED" stroke-width="1.8"/>
    <path d="M 8 14 Q 18 19 28 14" fill="none" stroke="#F18A50" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="1.5" y="10" width="4" height="4" fill="#F3F0E9" transform="rotate(45 3.5 12)"/>
    <rect x="30.5" y="10" width="4" height="4" fill="#F3F0E9" transform="rotate(45 32.5 12)"/>
  </g>
  <text x="64" y="27" class="sans ivory bold" font-size="13.5">Skillporter</text>
  <text x="142" y="27" class="mono dim small">v3.0.1 · local-first CLI &amp; MCP</text>

  <text x="766" y="27" class="mono amber micro">PINNED_COMMIT · 19 HARNESSES</text>
  <rect class="beacon" x="941" y="20" width="6" height="6" fill="#F18A50" transform="rotate(45 944 23)"/>

  <!-- Vertical split between CLI session (left) and Bridge topology (right) -->
  <line class="rule" x1="520" y1="44" x2="520" y2="489"/>

  <!-- ==================== LEFT: RECORDED V3.0.0 CLI ==================== -->
  <text x="24" y="72" class="mono dim micro">TERMINAL · ~/acme-api</text>

  <text x="24" y="100" class="mono"><tspan class="amber">$</tspan> <tspan class="ivory bold">skillporter add anthropics/skills --skill pdf --harness all</tspan></text>

  <g class="ln l1">
    <text x="24" y="126" class="mono"><tspan class="dim">Source:</tspan> <tspan class="blue">github:anthropics/skills</tspan>   <tspan class="dim">Commit:</tspan> <tspan class="ivory">2c5958ecac7c</tspan></text>
  </g>
  <g class="ln l2">
    <text x="24" y="148" class="mono"><tspan class="dim">Validation:</tspan> <tspan class="ivory bold">PASSED</tspan>   <tspan class="dim">Security:</tspan> <tspan class="ivory bold">0/100 · APPROVE</tspan> <tspan class="dim">(static v3.0.1)</tspan></text>
  </g>
  <g class="ln l3">
    <text x="24" y="170" class="mono"><tspan class="dim">Plan:</tspan> <tspan class="ivory">12 destinations across 19 harnesses</tspan> <tspan class="amber">(7 deduplicated)</tspan></text>
  </g>

  <g class="ln l4">
    <text x="24" y="200" class="mono">Claude Code        <tspan class="ivory bold">SUCCESS</tspan>  <tspan class="dim">.claude/skills/pdf</tspan></text>
    <text x="24" y="220" class="mono">OpenAI Codex       <tspan class="ivory bold">SUCCESS</tspan>  <tspan class="dim">.agents/skills/pdf</tspan></text>
  </g>
  <g class="ln l5">
    <text x="24" y="240" class="mono">Cursor / Zed / +5  <tspan class="ivory bold">SUCCESS</tspan>  <tspan class="amber">shared .agents/skills</tspan></text>
    <text x="24" y="260" class="mono">Hermes Agent       <tspan class="ivory bold">SUCCESS</tspan>  <tspan class="dim">.hermes/skills/pdf</tspan></text>
    <text x="24" y="280" class="mono">GitHub Copilot     <tspan class="ivory bold">SUCCESS</tspan>  <tspan class="dim">.github/skills/pdf</tspan></text>
  </g>

  <line class="rule-soft" x1="24" y1="302" x2="496" y2="302"/>

  <g class="ln l6">
    <text x="24" y="328" class="mono"><tspan class="amber">$</tspan> <tspan class="ivory bold">skillporter sync &amp;&amp; skillporter lock --check</tspan></text>
  </g>
  <g class="ln l7">
    <text x="24" y="352" class="mono"><tspan class="dim">wrote</tspan> <tspan class="blue">skillporter.lock</tspan> <tspan class="dim">(tree sha256: 6b86f0c798b5)</tspan></text>
    <text x="24" y="372" class="mono"><tspan class="ivory bold">skillporter.lock is up to date and verified (0 drift).</tspan></text>
  </g>

  <g class="ln l8">
    <text x="24" y="404" class="mono"><tspan class="amber">$</tspan> <tspan class="ivory bold">skillporter audit .</tspan></text>
  </g>
  <g class="ln l9">
    <text x="24" y="428" class="mono">pdf   <tspan class="blue">NO_DETECTED_FINDINGS</tspan>   <tspan class="dim">risk: 0/100 · Verdict:</tspan> <tspan class="ivory bold">HEALTHY</tspan></text>
  </g>
  <g class="ln l10">
    <text x="24" y="458" class="mono"><tspan class="amber">$</tspan> <rect class="cursor" x="38" y="446" width="7" height="14" fill="#F18A50"/></text>
  </g>

  <!-- ==================== RIGHT: LIVE BRIDGE TOPOLOGY ==================== -->
  <text x="544" y="72" class="mono dim micro">BRIDGE FAN-OUT · 1 SKILL -&gt; 19 AGENTS</text>

  <!-- Source package box -->
  <rect class="card" x="540" y="96" width="94" height="96" rx="8"/>
  <text x="554" y="118" class="mono dim micro">SOURCE</text>
  <text x="554" y="138" class="mono ivory bold small">SKILL.md</text>
  <text x="554" y="156" class="mono blue small">pdf</text>
  <text x="554" y="176" class="mono dim" font-size="10">0/100</text>

  <!-- Animated bridge span -->
  <line x1="634" y1="144" x2="688" y2="144" stroke="#F18A50" stroke-width="1.5"/>
  <g clip-path="url(#bridge-clip)">
    <rect class="packet" x="634" y="142.5" width="26" height="3" rx="1.5" fill="url(#sp-pulse)"/>
  </g>
  <rect x="631" y="141" width="6" height="6" fill="#F3F0E9" transform="rotate(45 634 144)"/>
  <rect x="685" y="141" width="6" height="6" fill="#F3F0E9" transform="rotate(45 688 144)"/>

  <!-- Target spine -->
  <line x1="688" y1="104" x2="688" y2="432" stroke="#263249" stroke-width="1.2"/>

  <!-- Target 1: Shared .agents/skills (highlighted) -->
  <line x1="688" y1="114" x2="704" y2="114" stroke="#F18A50" stroke-width="1.5"/>
  <rect class="card" x="704" y="90" width="256" height="58" rx="7" stroke="#F18A50"/>
  <text x="718" y="109" class="mono ivory bold small">.agents/skills/pdf</text>
  <text x="718" y="125" class="mono amber" font-size="10">8 primary + 6 compat harnesses</text>
  <text x="718" y="139" class="mono dim" font-size="9.5">Codex, Cursor, Gemini, Zed +4</text>

  <!-- Target 2: Claude Code -->
  <line x1="688" y1="180" x2="704" y2="180" stroke="#263249" stroke-width="1.2"/>
  <rect class="card" x="704" y="160" width="256" height="40" rx="7"/>
  <text x="718" y="176" class="mono ivory small">.claude/skills/pdf</text>
  <text x="718" y="191" class="mono dim" font-size="9.5">Claude Code · INTEGRATION_TESTED</text>

  <!-- Target 3: Hermes Agent -->
  <line x1="688" y1="232" x2="704" y2="232" stroke="#263249" stroke-width="1.2"/>
  <rect class="card" x="704" y="212" width="256" height="40" rx="7"/>
  <text x="718" y="228" class="mono ivory small">.hermes/skills/pdf</text>
  <text x="718" y="243" class="mono amber" font-size="9.5">Hermes Agent · RUNTIME_VERIFIED</text>

  <!-- Target 4: GitHub Copilot -->
  <line x1="688" y1="284" x2="704" y2="284" stroke="#263249" stroke-width="1.2"/>
  <rect class="card" x="704" y="264" width="256" height="40" rx="7"/>
  <text x="718" y="280" class="mono ivory small">.github/skills/pdf</text>
  <text x="718" y="295" class="mono dim" font-size="9.5">GitHub Copilot · FIXTURE_TESTED</text>

  <!-- Target 5: Windsurf -->
  <line x1="688" y1="336" x2="704" y2="336" stroke="#263249" stroke-width="1.2"/>
  <rect class="card" x="704" y="316" width="256" height="40" rx="7"/>
  <text x="718" y="332" class="mono ivory small">.windsurf/skills/pdf</text>
  <text x="718" y="347" class="mono dim" font-size="9.5">Windsurf · FIXTURE_TESTED</text>

  <!-- Target 6: Remaining 7 directories -->
  <line x1="688" y1="388" x2="704" y2="388" stroke="#263249" stroke-width="1.2"/>
  <rect class="card" x="704" y="368" width="256" height="40" rx="7"/>
  <text x="718" y="384" class="mono blue small">+ 7 more directories</text>
  <text x="718" y="399" class="mono dim" font-size="9.5">Cline, Roo, OpenCode, Junie +3</text>

  <!-- Bottom right integrity footer -->
  <line x1="688" y1="432" x2="704" y2="432" stroke="#155BE8" stroke-width="1.2"/>
  <text x="712" y="436" class="mono dim" font-size="10">Locked in <tspan class="ivory">skillporter.lock</tspan></text>
  <text x="544" y="466" class="mono dim" font-size="10">Zero runtime deps · Atomic rollback · SARIF 2.1.0</text>
</svg>
