[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillporter"
version = "3.1.0"
description = "Package manager, dependency resolver, and supply-chain security layer for AI agent skills across 19 harnesses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shanmukh Dheekonda" }]
keywords = [
  "ai-agent-skill-manager",
  "multi-agent-skill-synchronization",
  "skill-lifecycle-management",
  "skill-lockfile",
  "agent-skills",
  "claude-code",
  "codex",
  "cursor",
  "windsurf",
  "github-copilot",
  "gemini-cli",
  "hermes",
  "openclaw",
  "openhands",
  "goose",
  "mcp",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
skillporter = "skillporter.cli:main"

[project.urls]
Homepage = "https://github.com/Shanmukh-l33t/skillporter"
Issues = "https://github.com/Shanmukh-l33t/skillporter/issues"
Changelog = "https://github.com/Shanmukh-l33t/skillporter/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
  "skillporter",
  "skillporter.commands",
  "skillporter.bundled_skill",
]

[tool.setuptools.package-data]
skillporter = ["py.typed"]
"skillporter.bundled_skill" = ["SKILL_TEMPLATE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
