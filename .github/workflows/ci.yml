name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.12"
            os: macos-latest
          - python-version: "3.12"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit, Integration & Security Regression Suite
        run: python -m pytest tests/ -q
      - name: Verify Standalone Zipapp on ${{ matrix.os }}
        run: |
          python scripts/build_standalone.py
          python dist/skillporter.pyz --version

  packaging-and-sast:
    name: packaging, SAST & dogfood (sdist, wheel, standalone, npx, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build & security tools
        run: |
          python -m pip install --upgrade pip build twine bandit
          pip install -e ".[dev]"
      - name: Run Bandit SAST on core package
        run: bandit -r skillporter -ll -q
      - name: Dogfood CLI commands (validate, scan, audit, demo, explain, sandbox, graph, matrix)
        run: |
          skillporter validate .
          skillporter validate skills/skillporter --format json > /dev/null
          skillporter scan .
          skillporter scan . --format sarif > skillporter.sarif
          skillporter audit . --json > /dev/null
          skillporter demo
          skillporter explain DRIFT
          skillporter sandbox run skills/skillporter
          skillporter graph
          skillporter matrix
      - name: Build & validate Python wheel, sdist, standalone zipapp & npm package
        run: |
          python -m build --outdir dist-py
          twine check dist-py/*.tar.gz dist-py/*.whl
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --no-index --find-links dist-py skillporter
          /tmp/clean-venv/bin/skillporter --version
          python scripts/build_standalone.py
          test -f dist/skillporter.pyz
          test -f dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt --ignore-missing || (cd dist && sha256sum -c SHA256SUMS.txt)
          node npm/bin/skillporter.js --version
          node npm/bin/skillporter.js matrix --json > /dev/null
          npm pack --dry-run

  secrets:
    name: secret & supply-chain scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
