name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.12"
            os: macos-latest
          - python-version: "3.12"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest tests/ -q

  self-check:
    name: dogfood (validate, scan, standalone & npx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .
      - name: Validate every SKILL.md in the repo
        run: |
          skillporter validate .
          skillporter validate skills/skillporter --format json > /dev/null
      - name: Static security scan on shipped skills (text & SARIF 2.1.0)
        run: |
          skillporter scan .
          skillporter scan . --format sarif > skillporter.sarif
      - name: Verify demo, explain, sandbox & dependency graph
        run: |
          skillporter demo
          skillporter explain DRIFT
          skillporter sandbox run skills/skillporter
          skillporter graph
      - name: Harness matrix renders
        run: skillporter matrix
      - name: Build standalone zipapp & verify NPX wrapper
        run: |
          python scripts/build_standalone.py
          python dist/skillporter.pyz --version
          node npm/bin/skillporter.js matrix --json > /dev/null

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
